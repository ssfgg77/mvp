spring:
  datasource:
    url: jdbc:h2:mem:trading;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          schwab:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          schwab:
            authorization-uri: https://example.test/oauth/authorize
            token-uri: https://example.test/oauth/token

app:
  polling:
    orders-ms: 5000
  refresh:
    default-account-ms: 30000
  snapshot:
    ttl-ms: 300000
  schwab:
    api-base-url: https://example.test/api
