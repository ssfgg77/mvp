<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: content}">
<section>
  <h2>Positions</h2>
  <p>
    Account: <strong th:text="${account.nickname} ?: ${account.schwabAccountRef}">acc</strong>
  </p>
  <p>
    Positions are served from the 30s refresh snapshot store (not persisted).
    Use the API endpoint to view raw snapshot payload:
    <code th:text="'/api/accounts/' + ${account.id} + '/positions'">/api/...</code>
  </p>
  <article>
    <button type="button" onclick="loadSnapshot()">Load snapshot</button>
    <p id="snapshotMeta"></p>
    <pre id="snapshotOut" style="white-space:pre-wrap;"></pre>
  </article>

  <script th:inline="javascript">
    const accountId = [[${account.id}]];
    async function loadSnapshot() {
      const res = await fetch(`/api/accounts/${accountId}/positions`);
      const json = await res.json();
      const meta = document.getElementById('snapshotMeta');
      meta.textContent = `Snapshot: ${json.snapshotTimestamp || 'n/a'} | Stale: ${json.stale}`;
      document.getElementById('snapshotOut').textContent = JSON.stringify(json.positions, null, 2);
    }
  </script>
</section>
</html>
