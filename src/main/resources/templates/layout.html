<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} ?: 'Schwab Trading System'">Schwab Trading System</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <header>
      <nav>
        <ul>
          <li><strong>Schwab Trading</strong></li>
        </ul>
        <ul>
          <li><a href="/" >Dashboard</a></li>
          <li><a href="/accounts">Accounts</a></li>
          <li><a href="/quotes">Quotes</a></li>
          <li><a href="/orders">Orders</a></li>
          <li><a href="/settings">Settings</a></li>
          <li>
            <form method="post" action="/logout" style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="secondary">Logout</button>
            </form>
          </li>
        </ul>
      </nav>
    </header>

    <section th:if="${error}" style="margin-top: 1rem;">
      <article style="border-left: 4px solid #b00;">
        <strong>Error:</strong> <span th:text="${error}">error</span>
      </article>
    </section>

    <section th:insert="~{::content}"></section>
  </main>
</body>
</html>
