<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: content}">
<section>
  <h2>New Order</h2>
  <p>This skeleton submits to the REST API. Implement UI improvements as needed.</p>

  <form onsubmit="return submitOrder(event)">
    <label>Symbol <input name="symbol" required placeholder="AAPL"/></label>
    <label>Side
      <select name="side">
        <option>BUY</option>
        <option>SELL</option>
      </select>
    </label>
    <label>Quantity <input name="quantity" type="number" min="1" required value="1"/></label>
    <label>Order Type
      <select name="orderType" onchange="toggleLimit(this.value)">
        <option>MARKET</option>
        <option>LIMIT</option>
      </select>
    </label>
    <label id="limitRow" style="display:none;">Limit Price <input name="limitPrice" type="number" step="0.01"/></label>

    <button type="submit">Submit</button>
  </form>

  <pre id="out" style="white-space:pre-wrap;"></pre>

  <script>
    function toggleLimit(v) {
      document.getElementById('limitRow').style.display = (v === 'LIMIT') ? 'block' : 'none';
    }

    async function submitOrder(e) {
      e.preventDefault();
      const form = e.target;
      const payload = {
        symbol: form.symbol.value,
        side: form.side.value,
        quantity: parseInt(form.quantity.value, 10),
        orderType: form.orderType.value,
        limitPrice: form.orderType.value === 'LIMIT' ? parseFloat(form.limitPrice.value) : null
      };

      const idem = crypto.randomUUID();
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Idempotency-Key': idem
        },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      document.getElementById('out').textContent = JSON.stringify(json, null, 2);
      if (json.orderId) {
        window.location.href = '/orders/' + json.orderId;
      }
      return false;
    }
  </script>
</section>
</html>
