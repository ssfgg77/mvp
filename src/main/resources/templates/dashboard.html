<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: content}">
<section>
  <h2>Dashboard</h2>

  <article>
    <p>
      Schwab Connection:
      <strong th:text="${connected} ? 'CONNECTED' : 'DISCONNECTED'">DISCONNECTED</strong>
    </p>
    <div th:if="${!connected}">
      <a href="/connect/schwab" role="button">Connect Schwab</a>
    </div>
    <div th:if="${connected}">
      <form method="post" action="/api/auth/disconnect" onsubmit="return confirm('Disconnect Schwab?')">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="secondary">Disconnect</button>
      </form>
    </div>
  </article>

  <article>
    <h3>Default Account</h3>
    <p th:if="${settings.defaultSchwabAccount != null}">
      <span th:text="${settings.defaultSchwabAccount.nickname} ?: ${settings.defaultSchwabAccount.schwabAccountRef}">default</span>
    </p>
    <p th:if="${settings.defaultSchwabAccount == null}">
      Not set. Go to <a href="/settings">Settings</a> to choose.
    </p>
  </article>

  <article>
    <h3>Your Accounts</h3>
    <table>
      <thead>
        <tr><th>ID</th><th>Nickname</th><th>Type</th><th>Cash</th><th>Equity</th><th>Last Refreshed</th></tr>
      </thead>
      <tbody>
        <tr th:each="a : ${accounts}">
          <td th:text="${a.id}">1</td>
          <td><a th:href="@{'/accounts/' + ${a.id}}" th:text="${a.nickname} ?: ${a.schwabAccountRef}">acc</a></td>
          <td th:text="${a.accountType}">type</td>
          <td th:text="${a.cashBalance}">0</td>
          <td th:text="${a.equityValue}">0</td>
          <td th:text="${a.lastRefreshedAt}">-</td>
        </tr>
      </tbody>
    </table>
  </article>
</section>
</html>
